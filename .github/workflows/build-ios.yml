name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration. Release embeds the JS bundle (app runs standalone). Debug needs a Metro dev server.'
        type: choice
        options:
          - Release
          - Debug
        default: Release
      xcode_version:
        description: 'Optional: select a specific Xcode, e.g. 26.6 (uses /Applications/Xcode_<version>.app, must be >= 26.2). Empty = runner default.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    # macos-26 (default Xcode 26.x): firebase-ios-sdk 13.x, pulled in by @react-native-firebase 27, needs Xcode >= 26.2.
    # macos-15 only has Xcode 16.4 by default and fails with "incompatible tools version (6.2.0)".
    runs-on: macos-26
    timeout-minutes: 90

    env:
      CONFIGURATION: ${{ inputs.configuration }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup pnpm (repo has pnpm-lock.yaml v9 + pnpm-workspace.yaml with `allowBuilds`, i.e. pnpm 11)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      # 3. Setup Node.js (eas.json pins Node 24.x for this project's cloud builds)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 4. Optionally select a specific Xcode (before diagnostics so they show the selected one)
      - name: Select Xcode
        if: ${{ inputs.xcode_version != '' }}
        shell: bash
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "❌ $XCODE_APP not found. Installed Xcode versions:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "Selected: $XCODE_APP"

      # 5. Diagnostics: Environment & Tooling
      - name: Environment Diagnostics
        shell: bash
        run: |
          echo "=== System Information ==="
          sw_vers
          uname -m
          echo ""
          echo "=== Node & Package Managers ==="
          node --version
          pnpm --version
          echo ""
          echo "=== Xcode Toolchain ==="
          xcodebuild -version
          echo ""
          echo "=== Available iOS SDKs ==="
          xcodebuild -showsdks
          echo ""
          echo "=== Installed Xcode versions ==="
          ls -d /Applications/Xcode*.app
          echo ""
          echo "=== Build configuration ==="
          echo "$CONFIGURATION"

      # 6. Fail fast: firebase-ios-sdk 13.x (Swift tools 6.2.1) only resolves on Xcode >= 26.2
      - name: Check Xcode version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(xcodebuild -version | awk '/^Xcode/ {print $2}')
          IFS=. read -r MAJOR MINOR _ <<< "$VERSION"
          MINOR="${MINOR:-0}"
          if [ "$MAJOR" -lt 26 ] || { [ "$MAJOR" -eq 26 ] && [ "$MINOR" -lt 2 ]; }; then
            echo "::error title=Xcode too old::Xcode $VERSION is selected, but firebase-ios-sdk 13.x needs Xcode >= 26.2. Use runs-on: macos-26 or set the xcode_version input (see 'Installed Xcode versions' in the previous step)."
            exit 1
          fi
          echo "✅ Xcode $VERSION is OK (>= 26.2)"

      # 7. Install JS dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 8. Create .env (the app reads EXPO_PUBLIC_* at bundle time; .env is not committed, only .env.example)
      # Add each value as a repository Secret or Variable with the same name.
      # EXPO_PUBLIC_* values end up inside the app bundle anyway, so Variables are fine too.
      - name: Create .env from secrets/variables
        shell: bash
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_DATING_API_URL: ${{ secrets.EXPO_PUBLIC_DATING_API_URL || vars.EXPO_PUBLIC_DATING_API_URL }}
          EXPO_PUBLIC_AUTH_API_URL: ${{ secrets.EXPO_PUBLIC_AUTH_API_URL || vars.EXPO_PUBLIC_AUTH_API_URL }}
          EXPO_PUBLIC_API_HOST: ${{ secrets.EXPO_PUBLIC_API_HOST || vars.EXPO_PUBLIC_API_HOST }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY || vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID || vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET || vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID || vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
        run: |
          set -euo pipefail

          NAMES="EXPO_PUBLIC_API_URL EXPO_PUBLIC_DATING_API_URL EXPO_PUBLIC_AUTH_API_URL EXPO_PUBLIC_API_HOST
          EXPO_PUBLIC_FIREBASE_API_KEY EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN EXPO_PUBLIC_FIREBASE_PROJECT_ID
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID EXPO_PUBLIC_FIREBASE_APP_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"

          : > .env
          for name in $NAMES; do
            printf "%s='%s'\n" "$name" "${!name:-}" >> .env
          done

          echo ".env created with these keys (values hidden):"
          cut -d= -f1 .env

          if [ -z "${EXPO_PUBLIC_DATING_API_URL:-}" ] && [ -z "${EXPO_PUBLIC_API_URL:-}" ]; then
            echo "::warning title=API URL not set::EXPO_PUBLIC_DATING_API_URL / EXPO_PUBLIC_API_URL is empty. The app will fall back to http://localhost:3000/api and cannot reach your server from a real iPhone. Use an https URL."
          fi
          if [ -z "${EXPO_PUBLIC_FIREBASE_API_KEY:-}" ] || [ -z "${EXPO_PUBLIC_FIREBASE_APP_ID:-}" ]; then
            echo "::warning title=Firebase JS config not set::EXPO_PUBLIC_FIREBASE_* is empty, so Firebase will be disabled in the app (login will not work)."
          fi

      # 9. Firebase iOS config. @react-native-firebase/app needs GoogleService-Info.plist on iOS,
      #    but the repo only has the Android google-services.json.
      #    - Real file: store base64 of it in the secret GOOGLE_SERVICE_INFO_PLIST_BASE64  (base64 -i GoogleService-Info.plist | pbcopy)
      #    - Otherwise a PLACEHOLDER is generated so the build can compile (Firebase/Google login will NOT work at runtime).
      - name: Prepare GoogleService-Info.plist
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]; then
            node -e 'process.stdout.write(Buffer.from(process.env.GOOGLE_SERVICE_INFO_PLIST_BASE64, "base64"))' > GoogleService-Info.plist
            echo "Using GoogleService-Info.plist from secret GOOGLE_SERVICE_INFO_PLIST_BASE64"
          else
            echo "::warning title=Placeholder GoogleService-Info.plist::Secret GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set. Generating a PLACEHOLDER plist so the build compiles. Firebase native auth and Google Sign-In will not work in this IPA."
            node <<'NODE'
          const fs = require('fs');

          let gs = {};
          try { gs = JSON.parse(fs.readFileSync('google-services.json', 'utf8')); } catch (e) {}

          const info = gs.project_info || {};
          const projectId = info.project_id || 'placeholder-project';
          const senderId = info.project_number || '000000000000';
          const bucket = info.storage_bucket || `${projectId}.appspot.com`;

          const oauth = ((gs.client || [])[0] || {}).oauth_client || [];
          const web = oauth.find((c) => c.client_type === 3);
          const clientId = (web && web.client_id) || `${senderId}-placeholder.apps.googleusercontent.com`;
          const reversed = 'com.googleusercontent.apps.' + clientId.replace('.apps.googleusercontent.com', '');

          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo || {};
          const bundleId = (app.ios && app.ios.bundleIdentifier) || 'com.example.app';

          const entries = [
            ['CLIENT_ID', clientId],
            ['REVERSED_CLIENT_ID', reversed],
            ['API_KEY', 'AIzaSy' + 'A'.repeat(33)],
            ['GCM_SENDER_ID', senderId],
            ['PLIST_VERSION', '1'],
            ['BUNDLE_ID', bundleId],
            ['PROJECT_ID', projectId],
            ['STORAGE_BUCKET', bucket],
            ['GOOGLE_APP_ID', `1:${senderId}:ios:0000000000000000`],
          ];
          const bools = [
            ['IS_ADS_ENABLED', false],
            ['IS_ANALYTICS_ENABLED', false],
            ['IS_APPINVITE_ENABLED', true],
            ['IS_GCM_ENABLED', true],
            ['IS_SIGNIN_ENABLED', true],
          ];

          const xml = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
            '<plist version="1.0">',
            '<dict>',
            ...entries.map(([k, v]) => `  <key>${k}</key>\n  <string>${v}</string>`),
            ...bools.map(([k, v]) => `  <key>${k}</key>\n  <${v}/>`),
            '</dict>',
            '</plist>',
            '',
          ].join('\n');

          fs.writeFileSync('GoogleService-Info.plist', xml);
          NODE
          fi

          plutil -lint GoogleService-Info.plist

      # 10. Patch app.json (CI only, not committed) so iOS prebuild works with React Native Firebase:
      #    - expo.ios.googleServicesFile -> ./GoogleService-Info.plist  (repo only sets android.googleServicesFile)
      #    - expo-build-properties ios.useFrameworks = "dynamic"        (RNFirebase uses Swift Package Manager on iOS,
      #      which requires dynamic linkage; static linkage fails with "SPM + static linkage is not supported")
      #    Values already present in app.json are kept.
      - name: Patch Expo config for iOS
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const file = 'app.json';
          const cfg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const expo = cfg.expo || (cfg.expo = {});

          expo.ios = expo.ios || {};
          if (!expo.ios.googleServicesFile) {
            expo.ios.googleServicesFile = './GoogleService-Info.plist';
          }

          expo.plugins = expo.plugins || [];
          const nameOf = (p) => (Array.isArray(p) ? p[0] : p);
          let idx = expo.plugins.findIndex((p) => nameOf(p) === 'expo-build-properties');
          if (idx === -1) {
            expo.plugins.push(['expo-build-properties', {}]);
            idx = expo.plugins.length - 1;
          }
          if (!Array.isArray(expo.plugins[idx])) {
            expo.plugins[idx] = [expo.plugins[idx], {}];
          }
          const opts = expo.plugins[idx][1] || (expo.plugins[idx][1] = {});
          opts.ios = opts.ios || {};
          if (!opts.ios.useFrameworks) {
            opts.ios.useFrameworks = 'dynamic';
          }

          fs.writeFileSync(file, JSON.stringify(cfg, null, 2) + '\n');
          console.log('ios.googleServicesFile =', expo.ios.googleServicesFile);
          console.log('expo-build-properties ios =', JSON.stringify(opts.ios));
          NODE

      # 11. Setup Ruby for CocoaPods
      # bundler-cache is disabled because Gemfile.lock is not committed in repository
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      # 12. Install Bundler dependencies
      - name: Install Bundler dependencies
        shell: bash
        run: |
          if [ ! -f Gemfile ]; then
            echo "⚠️ Gemfile not found. Creating default Gemfile with cocoapods ~> 1.16 and json < 3.0..."
            printf 'source "https://rubygems.org"\n\ngem "cocoapods", "~> 1.16"\ngem "json", "< 3.0"\n' > Gemfile
          fi
          bundle install

      # 13. Generate iOS native project via Expo Prebuild
      # --no-install skips automatic pod install so we run it deterministically under Ruby 3.3
      - name: Generate iOS native project
        run: pnpm expo prebuild --platform ios --clean --no-install
        env:
          EXPO_USE_PNPM: "1"

      # 14. Show what prebuild generated (helps debugging pod install issues)
      - name: Inspect generated iOS project
        working-directory: ios
        shell: bash
        run: |
          echo "=== ios/ ==="
          ls -la
          echo ""
          echo "=== Podfile.properties.json ==="
          cat Podfile.properties.json || true
          echo ""
          echo "=== use_frameworks / RNFirebase lines in Podfile ==="
          grep -nE "use_frameworks|RNFirebase|USE_FRAMEWORKS|useFrameworks" Podfile || true
          echo ""
          echo "=== GoogleService-Info.plist inside the Xcode project ==="
          find . -name GoogleService-Info.plist -not -path "./Pods/*" || true

      # 15. Install CocoaPods dependencies
      - name: Install CocoaPods dependencies
        working-directory: ios
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f Podfile ]; then
            echo "❌ ios/Podfile not found. Expo prebuild failed to generate native project."
            exit 1
          fi
          echo "Active Ruby: $(ruby -v)"
          echo "Active Bundler: $(bundle -v)"
          echo "Active CocoaPods: $(bundle exec pod --version)"
          bundle exec pod install

      # 16. Detect Xcode workspace and scheme
      - name: Detect Xcode workspace and scheme
        id: detect
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACES=()
          for ws in *.xcworkspace; do
            if [ -e "$ws" ]; then
              WORKSPACES+=("$ws")
            fi
          done

          if [ ${#WORKSPACES[@]} -eq 0 ]; then
            echo "❌ No .xcworkspace found in ios directory"
            ls -la
            exit 1
          fi

          WORKSPACE_NAME="${WORKSPACES[0]}"
          echo "Found workspace: $WORKSPACE_NAME"
          echo "workspace=$WORKSPACE_NAME" >> "$GITHUB_OUTPUT"

          echo "=== Available Xcode Targets & Schemes ==="
          xcodebuild -workspace "$WORKSPACE_NAME" -list

          # Extract app scheme programmatically using JSON
          SCHEME_JSON=$(xcodebuild -workspace "$WORKSPACE_NAME" -list -json 2>/dev/null || true)
          SCHEME=""

          if [ -n "$SCHEME_JSON" ]; then
            SCHEME=$(node -e '
              try {
                const data = JSON.parse(process.argv[1]);
                const schemes = (data.workspace && data.workspace.schemes) || (data.project && data.project.schemes) || [];
                const workspaceBase = process.argv[2].replace(/\.xcworkspace$/, "");

                // Exclude CocoaPods and testing schemes
                const appSchemes = schemes.filter(s => !s.startsWith("Pods-") && !s.toLowerCase().includes("test"));

                // Prefer scheme matching workspace base name (case-insensitive)
                let matched = appSchemes.find(s => s.toLowerCase() === workspaceBase.toLowerCase());
                if (!matched && appSchemes.length > 0) {
                  matched = appSchemes[0];
                }
                if (matched) {
                  console.log(matched);
                }
              } catch (e) {}
            ' "$SCHEME_JSON" "$WORKSPACE_NAME")
          fi

          if [ -z "$SCHEME" ]; then
            SCHEME="${WORKSPACE_NAME%.xcworkspace}"
            echo "⚠️ Could not extract scheme from JSON. Using workspace base name: $SCHEME"
          fi

          echo "Selected Scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      # 17. Build unsigned iOS app
      - name: Build unsigned iOS app
        working-directory: ios
        shell: bash
        env:
          WORKSPACE: ${{ steps.detect.outputs.workspace }}
          SCHEME: ${{ steps.detect.outputs.scheme }}
        run: |
          set -euo pipefail

          echo "=== Build Configuration ==="
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          echo "Configuration: $CONFIGURATION"
          echo "SDK: iphoneos"
          echo "Destination: generic/platform=iOS"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      # 18. Package .app into unsigned .ipa
      - name: Package unsigned IPA
        working-directory: ios
        shell: bash
        env:
          SCHEME: ${{ steps.detect.outputs.scheme }}
        run: |
          set -euo pipefail

          PRODUCTS_DIR="build/Build/Products/${CONFIGURATION}-iphoneos"

          if [ ! -d "$PRODUCTS_DIR" ]; then
            echo "❌ Build products directory does not exist: $PRODUCTS_DIR"
            echo "Contents of build/ directory:"
            find build -maxdepth 4 -ls || true
            exit 1
          fi

          echo "Searching for .app bundles in $PRODUCTS_DIR..."
          APPS=()
          for app in "$PRODUCTS_DIR"/*.app; do
            if [ -e "$app" ]; then
              APPS+=("$app")
            fi
          done

          if [ ${#APPS[@]} -eq 0 ]; then
            echo "❌ No .app found in $PRODUCTS_DIR"
            ls -la "$PRODUCTS_DIR"
            exit 1
          fi

          SELECTED_APP=""
          if [ ${#APPS[@]} -eq 1 ]; then
            SELECTED_APP="${APPS[0]}"
          else
            echo "Multiple .app bundles found: ${APPS[*]}"
            SCHEME_LOWER=$(echo "$SCHEME" | tr '[:upper:]' '[:lower:]')
            for app in "${APPS[@]}"; do
              base=$(basename "$app" .app)
              base_lower=$(echo "$base" | tr '[:upper:]' '[:lower:]')
              if [ "$base" = "$SCHEME" ] || [ "$base_lower" = "$SCHEME_LOWER" ]; then
                SELECTED_APP="$app"
                break
              fi
            done
            if [ -z "$SELECTED_APP" ]; then
              echo "❌ Multiple .app bundles found and none matched scheme '$SCHEME'"
              exit 1
            fi
          fi

          echo "Packaging application: $SELECTED_APP"

          rm -rf Payload App-Unsigned.ipa
          mkdir -p Payload

          cp -R "$SELECTED_APP" Payload/

          zip -qry App-Unsigned.ipa Payload

          if [ ! -f "App-Unsigned.ipa" ]; then
            echo "❌ Failed to create App-Unsigned.ipa"
            exit 1
          fi

          IPA_SIZE=$(ls -lh App-Unsigned.ipa | awk '{print $5}')
          echo "✅ Unsigned IPA created successfully: App-Unsigned.ipa ($IPA_SIZE)"

      # 19. Upload IPA as GitHub Actions artifact
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: mewdy-ios-unsigned-ipa
          path: ios/App-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7